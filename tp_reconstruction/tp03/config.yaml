# TP-03 pre-registration. Everything here is fixed BEFORE any entry or exit trigger test is run (TP03_PHASE0_AUDIT.md).
# Changing a value after seeing a result is a deviation and must be recorded in the report.
version: 1
inputs:                       # read-only
  tp01_dir: tp_reconstruction/data
  tp02_dir: tp_reconstruction/tp02/data
  raw_trades: Trades_GKOHNP140.csv
  market_env_var: ALGO8_MARKET_DIR
evidence_classes: [CONFIRMED, STRONGLY_SUPPORTED, WEAKLY_SUPPORTED, UNRESOLVED, NOT_TESTABLE]
evidence_rubric:
  CONFIRMED: direct decision evidence (decision timestamp or tag) or a deterministic reproduction >= 99 % of events in BOTH underlyings, with the registered falsifier failing to refute it
  STRONGLY_SUPPORTED: >= 2 independent observations; effect in both underlyings and >= 60 % of cycles; Holm-adjusted p < 0.05 inside its family; effect size above the registered threshold; survives the decision-time and convention sensitivities
  WEAKLY_SUPPORTED: effect present but fails one of the above
  UNRESOLVED: the evidence cannot separate the competing explanations
  NOT_TESTABLE: the required source data do not exist
# ---------------------------------------------------------------- entry program
entry:
  d1_windows: ["09:30", "09:45", "10:00", "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45", "12:00", "12:30", "13:30", "13:45", "14:00", "14:15", "14:30"]   # ENT-02 (17)
  d1_control_windows: ["12:15", "12:45", "13:00", "13:15"]      # ENT-02 'inconsistent' windows: natural no-action / zero-quantity cases
  opening_time: "09:16"
  d0_windows: {start: "09:30", end: "15:00", step_minutes: 15}  # quarter windows on the expiry day (ENT-03); phase checked descriptively before any test
  window_bounds_seconds: {before: 2, after: 180}                # T-2 s ... T+3 min
  action_definition: opening short fill (role open, sell) by a body (num) parent order whose first fill lies inside the window
  no_action_classes:
    NO_ACTION_ACTIVE: no action AND (any algo fill in the same underlying and cycle within +-30 min of the window) AND index bars complete for [T-60, T]
    NO_ACTION_UNCERTAIN: no action AND no algo activity within +-30 min, or incomplete bars
    NOT_APPLICABLE: after a cycle-stop liquidation (s_), before the first entry of the cycle, or (expiry day) while the book holds no short (ENT-03)
  strike_references:                                            # exact-match rates are reported under each, never chosen after the fact
    R1: last completed 1-minute index close before the order-entry minute
    R2: last completed 1-minute index close before the first fill
    R3: 09:15 index close (opening only)
  strike_step: {NIFTY: 50, SENSEX: 100}
  wing_budget_fraction: 0.025                                  # HDG-02, tested not assumed
  wing_premium_references: [algo_quote_from_limit, last_completed_bar_close, fill_price]   # quote = limit / 1.15 (buy) or / 0.85 (sell); IOC wings and lump use the register's constants
  base_units: {NIFTY: 65, SENSEX: 20}
  state_times: {S0: earliest decision bound (order-entry minute start, or tag time), S1: latest bound (first fill)}
  state_features: [spot_ret_since_entry_bp, spot_ret_prev_window_bp, spot_ret_15m_bp, spot_ret_60m_bp, rv30_bp, range_expansion, dist_from_open_bp, minutes_to_expiry,
                   short_units_CE, short_units_PE, long_units_CE, long_units_PE, net_units_CE, net_units_PE, cycle_mtm, short_body_mtm, wing_mtm, atm_ce_premium, atm_pe_premium, atm_straddle_premium_change_since_entry,
                   ce_pe_premium_imbalance, adds_so_far, units_added_so_far, minutes_since_last_close, gross_short_notional]
  margin_and_capital: NOT_TESTABLE                              # no margin, SPAN or capital data; only the proxy gross_short_notional is computed and labelled a proxy
# ---------------------------------------------------------------- exit program
exit:
  batch:
    primary_gap_seconds: 10                                     # consecutive closing PARENT orders of one underlying closer than this are one batch
    sensitivity_gap_seconds: [2, 5, 30, 60]
    block_definition: closing parent orders of one app key and one order-number block with consecutive numbers (gap <= 20)
    unit: parent order (partial fills of one parent are never counted as separate decisions)
  decision_time_bounds: {num: [order_entry_minute, first_fill], tagged: tag time when validated}
  state_times: [S0, S1]
  portfolio_metrics: [cycle_mtm, short_body_mtm, long_wing_mtm, side_mtm_CE, side_mtm_PE, open_short_units_CE, open_short_units_PE, open_long_units_CE, open_long_units_PE, minutes_to_expiry, units_closed_by_previous_batch, inventory_remaining]
  position_metrics: [premium_ratio_to_reference (FIFO, LIFO, AVG), absolute_premium, position_mtm, position_age_minutes, position_lots, strike_distance_from_atm_steps]
  selection_criteria_family: [position_metrics above]           # Holm family for 'which contracts are closed'
  tick_minutes_of_15: [14, 29, 44, 59, 0, 15, 30, 45]           # residues examined; the maximum over all 15 residues is the test statistic
  stop_readings: {source: risk_rule_validation, readings: [A, B, C, D, E], kill_switch_rupees: 200000, carry_pct: 0.04, capital_rupees: 20000000}   # unchanged from the risk-rule study; no threshold is tuned
  action_match_window_minutes: 5
# ---------------------------------------------------------------- inference
inference:
  independence_unit: expiry_cycle
  bootstrap_reps: 1000
  permutations: 500
  seed: 20261114
  permutation_strata: [cycle, day_type, hour]
  families: {entry: Holm over all registered entry tests, exit: Holm over all registered exit tests}
  effect_thresholds: {ratio: 1.5, auc: 0.55, excess_share: 0.10, exact_match_rate_confirm: 0.99}
  min_events: 100
  min_cycles: 10
boundaries: [no alpha discovery, no supervised model, no threshold sweep, no future information, no invented Greeks / IV / margin]
