  parameter_ranges: {threshold_rs: [-130000, -133000, -135000], poll_interval_s: [60], delay_minutes: [0, 1], passive_at_stop: ["close_all", "keep"]}
  implementation_status: NOT_STARTED
  may_run_historically: conditional
